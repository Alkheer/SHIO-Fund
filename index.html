

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHIO Fund | إدارة الأعضاء</title>
<style>

.card {
  text-align: right;
}

.card h2,
.card label {
  text-align: right;
}

.card input,
.card textarea {
  text-align: right;
}

.card button {
  display: block;
  margin-right: 0;
  margin-left: auto;
}
h2 {
  display: block;
  color: #123b4a;
  font-size: 24px;
  font-weight: bold;
  margin: 0 0 20px;
}

label {
  display: block;
  color: #243746;
  font-size: 16px;
  font-weight: bold;
  margin: 14px 0;
}

input, textarea {
  color: #243746;
  background: #ffffff;
}

input::placeholder {
  color: #64748b;
  opacity: 1;
}

.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  text-align: center;
}
.brand img {
  width: 110px;
  height: 110px;
  object-fit: contain;
  background: white;
  border-radius: 10px;
  padding: 5px;
}

.brand h1 {
  margin: 0 0 8px;
}

.brand p {
  margin: 4px 0;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: Arial, sans-serif;
  background: #f1f5f7; color: #243746;
}
header {
  background: #123b4a; color: white;
  padding: 25px; text-align: center;
}
header h1 { margin: 0 0 8px; }
main { max-width: 900px; margin: 25px auto; padding: 0 15px; }
.card {
  background: white; padding: 22px; margin-bottom: 20px;
  border-radius: 12px; border: 1px solid #dce5e9;
}
.warning {
  background: #fff8e7; border-right: 5px solid #d99a16;
  padding: 15px; border-radius: 8px;
}
label { display: block; margin: 12px 0; }
input, textarea {
  display: block; width: 100%; padding: 12px; margin-top: 6px;
  border: 1px solid #bdcbd2; border-radius: 7px;
  font-size: 16px;
}
button {
  background: #12617a; color: white; border: 0;
  padding: 11px 20px; border-radius: 7px;
  cursor: pointer; margin-top: 8px; font-size: 15px;
}
.member {
  padding: 12px; border: 1px solid #dce5e9;
  border-radius: 8px; margin-top: 12px;
}
.small { color: #64748b; font-size: 13px; }
</style>
</head>
<body>
<header>
  
<header>
  <div class="brand">
    <img src="shio-logo.jpg" alt="SHIO VZW Logo">
    <div>
      <h1>SHIO Fund</h1>
      <p>نظام إدارة ملفات الأعضاء والأسر</p>
      <p>Member & Family Management</p>
    </div>
  </div>

</header>

<section class="card" id="loginCard">
  <h2>تسجيل الدخول | Sign in</h2>
  <label>البريد الإلكتروني
    <input id="loginEmail" type="email" required placeholder="name@example.com">
  </label>
  <label>كلمة المرور
    <input id="loginPassword" type="password" required>
  </label>
  <button type="button" onclick="login()">دخول</button>
  <p id="loginMessage" class="small"></p>
</section>

<main>
  <div class="warning">
    <strong>نسخة تجريبية</strong>
    <p>هذه الواجهة للاختبار فقط. لا تستخدم بيانات الأعضاء الحقيقية الآن.</p>
  </div>

  <section class="card">
    <h2>البحث عن عضو</h2>
    <input id="search" placeholder="الاسم أو رقم العضوية">
    <button onclick="searchMembers()">بحث</button>
    <div id="results"></div>
  </section>

  <section class="card">
    <h2>إضافة عضو جديد</h2>
    <form id="memberForm">
      <label>رقم العضوية
        <input id="number" required placeholder="SHIO-001">
      </label>
      <label>الاسم الكامل
        <input id="name" required>
      </label>
      <label>رقم الهاتف
        <input id="phone">
      </label>
      <label>ملاحظات
        <textarea id="notes" rows="3"></textarea>
      </label>
      <button type="submit">إضافة عضو تجريبي</button>
    </form>
    <p class="small">البيانات مؤقتة وتختفي عند تحديث الصفحة.</p>
  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://pigepmydufgughrgcpja.supabase.co";
const SUPABASE_KEY = "sb_publishable_CyZug3hKmkTbgVxQZFw0dA_GZwrCqV6";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function login() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const message = document.getElementById("loginMessage");

  message.textContent = "جارٍ تسجيل الدخول...";

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = "فشل تسجيل الدخول: " + error.message;
    return;
  }

  message.textContent = "تم تسجيل الدخول بنجاح.";
  await loadMembers();
}

async function loadMembers() {
  const { data, error } = await supabaseClient
    .from("members")
    .select("member_number, full_name, phone, notes")
    .order("member_number");

  if (error) {
    document.getElementById("results").textContent =
      "تعذر تحميل الأعضاء: " + error.message;
    return;
  }

  showMembers(data || []);
}

document.getElementById("memberForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const { data: sessionData } = await supabaseClient.auth.getSession();

  if (!sessionData.session) {
    alert("يرجى تسجيل الدخول أولاً.");
    return;
  }

  const number = document.getElementById("number").value.trim();
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const notes = document.getElementById("notes").value.trim();

  const { error } = await supabaseClient.from("members").insert({
    member_number: number,
    full_name: name,
    phone: phone || null,
    notes: notes || null
  });

  if (error) {
    alert("لم يتم حفظ العضو: " + error.message);
    return;
  }

  this.reset();
  alert("تم حفظ العضو في قاعدة البيانات.");
  await loadMembers();
});

function showMembers(list) {
  const results = document.getElementById("results");
  results.replaceChildren();

  if (!list.length) {
    results.textContent = "لا توجد نتائج.";
    return;
  }

  list.forEach(m => {
    const item = document.createElement("div");
    item.className = "member";

    const title = document.createElement("strong");
    title.textContent = m.member_number + " — " + m.full_name;

    const details = document.createElement("p");
    details.textContent =
      "الهاتف: " + (m.phone || "غير مسجل") +
      " | ملاحظات: " + (m.notes || "لا توجد");

    item.append(title, details);
    results.appendChild(item);
  });
}


async function searchMembers() {
  const q = document.getElementById("search").value.trim();
  const results = document.getElementById("results");

  results.textContent = "جارٍ الاتصال بقاعدة البيانات...";

  const { data, error } = await supabaseClient
    .from("members")
    .select("member_number, full_name, phone, notes")
    .order("member_number");

  if (error) {
    results.textContent = "خطأ من قاعدة البيانات: " + error.message;
    return;
  }

  const filtered = (data || []).filter(m => {
    const text = `${m.member_number || ""} ${m.full_name || ""}`.toLowerCase();
    return text.includes(q.toLowerCase());
  });

  showMembers(filtered);
}


  showMembers(data);
}

</script>


</body>
</html>
